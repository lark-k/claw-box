name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Set up plugin test runtime
        # Plugin has no npm dependencies; pin the Node test runtime explicitly.
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Set up board installer test runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.6'
      - name: Install board protocol test dependency
        run: python -m pip install -r tests/ClawBox.Board.Tests/requirements.txt
      - name: Restore, build, test and formatting
        shell: pwsh
        run: ./scripts/ci/Verify.ps1
      - name: Verify published EXE and private config exclusions
        shell: pwsh
        run: ./scripts/ci/Test-Publish.ps1 -Runtime win-x64
      - name: Verify desktop portable package and render states
        shell: pwsh
        run: ./scripts/ci/Test-DesktopPublish.ps1
      - name: Build and verify desktop installer lifecycle
        shell: pwsh
        run: |
          ./scripts/release/Publish-Installer.ps1 -PackagePath ./artifacts/publish/QuantumHarness/win-x64
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          ./tests/ClawBox.Installer.Tests/Test-Installer.ps1 -InstallerPath "${PWD}/artifacts/releases/installers/QuantumHarness-$version-win-x64-Setup.exe"
      - name: Verify legacy Windows desktop and executor packages
        shell: pwsh
        run: |
          ./scripts/ci/Test-DesktopPublish.ps1 -LegacyWindows
          ./scripts/ci/Test-Publish.ps1 -PackagePath ./artifacts/publish/QuantumHarness/win-x64-legacy/executor
          ./scripts/release/Publish-Installer.ps1 -PackagePath ./artifacts/publish/QuantumHarness/win-x64-legacy -LegacyWindows
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          ./tests/ClawBox.Installer.Tests/Test-Installer.ps1 -InstallerPath "${PWD}/artifacts/releases/installers/QuantumHarness-$version-win-x64-legacy-Setup.exe" -LegacyWindows
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executor-validation
          path: |
            artifacts/test-results/
            artifacts/publish/
            artifacts/desktop-qa/
            artifacts/releases/installers/
            artifacts/installer-qa/
          retention-days: 14

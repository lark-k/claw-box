name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Set up plugin test runtime
        # Plugin has no npm dependencies; pin the Node test runtime explicitly.
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Set up board installer test runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.6'
      - name: Install board protocol test dependency
        run: python -m pip install -r tests/ClawBox.Board.Tests/requirements.txt
      - name: Restore, build, test and formatting
        shell: pwsh
        run: ./scripts/ci/Verify.ps1
      - name: Verify published EXE and private config exclusions
        shell: pwsh
        run: ./scripts/ci/Test-Publish.ps1 -Runtime win-x64
      - name: Verify desktop portable package and render states
        shell: pwsh
        run: ./scripts/ci/Test-DesktopPublish.ps1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executor-validation
          path: |
            artifacts/test-results/
            artifacts/publish/
            artifacts/desktop-qa/
          retention-days: 14
